name: Compilar L4D2 Windows (Fenix Fixed)

on: [push, workflow_dispatch]

jobs:
  build:
    name: Compilar Extension Windows
    runs-on: windows-latest

    steps:
      - name: 1. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. Instalar AMBuild
        run: |
          python -m pip install wheel
          python -m pip install git+https://github.com/alliedmodders/ambuild

      - name: 3. Descargar Tu Codigo
        uses: actions/checkout@v4
        with:
          path: extension # Lo ponemos en una carpeta clara

      - name: 4. Descargar Dependencias (SM, MM, SDK)
        run: |
          git clone --recursive https://github.com/alliedmodders/sourcemod sourcemod
          git clone --recursive https://github.com/alliedmodders/metamod-source mmsource
          git clone --recursive https://github.com/alliedmodders/hl2sdk -b l4d2 hl2sdk-l4d2
          git clone --recursive https://github.com/rlabrecque/SteamworksSDK steamworks-sdk-temp

      - name: 5. Preparar Estructura Steamworks (Smart Fix)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "steamworks-sdk\public\steam"
          $headerFile = Get-ChildItem -Path "steamworks-sdk-temp" -Filter "steam_gameserver.h" -Recurse | Select-Object -First 1
          if ($headerFile) {
              $sourceDir = $headerFile.DirectoryName
              Copy-Item -Path "$sourceDir\*" -Destination "steamworks-sdk\public\steam\" -Recurse -Force
              Write-Host "Steamworks preparado."
          }

      - name: 6. Parche Automático de configure.py
        shell: powershell
        run: |
          $path = "extension/configure.py"
          if (Test-Path $path) {
            (Get-Content $path) -replace '%default', '%(default)s' | Set-Content $path
            Write-Host "configure.py parcheado."
          }

      - name: 7. Configurar y Compilar (Rutas Absolutas)
        shell: cmd
        working-directory: extension
        env:
          # Forzamos las variables de entorno para que AMBuild las vea sí o sí
          HL2SDKL4D2: ${{ github.workspace }}\hl2sdk-l4d2
          SOURCEMOD: ${{ github.workspace }}\sourcemod
          MMSOURCE112: ${{ github.workspace }}\mmsource
          SWSDK: ${{ github.workspace }}\steamworks-sdk
        run: |
          mkdir build
          cd build
          :: Usamos rutas absolutas con el workspace de GitHub
          python ..\configure.py --enable-optimize ^
            --sdks=l4d2 ^
            --targets=x86 ^
            --sm-path="${{ github.workspace }}\sourcemod" ^
            --mms-path="${{ github.workspace }}\mmsource" ^
            --hl2sdk-root="${{ github.workspace }}" ^
            --swsdk-path="${{ github.workspace }}\steamworks-sdk"
          
          if %errorlevel% neq 0 exit /b %errorlevel%
          ambuild

      - name: 8. Subir archivo .DLL final
        uses: actions/upload-artifact@v4
        with:
          name: sourcetvsupport-windows
          path: extension/build/package/**/*.dll
