name: Compilar L4D2 Windows (Steamworks SDK Smart Fix)

on: [push, workflow_dispatch]

jobs:
  build:
    name: Compilar Windows-latest
    runs-on: windows-latest

    steps:
      - name: 1. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. Instalar AMBuild
        run: |
          python -m pip install wheel
          python -m pip install git+https://github.com/alliedmodders/ambuild

      - name: 3. Descargar Tu Codigo
        uses: actions/checkout@v4
        with:
          path: sourcetvsupport

      - name: 4. Descargar SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: master
          path: sourcemod
          submodules: true

      - name: 5. Descargar MetaMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource

      - name: 6. Descargar HL2SDK (L4D2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: l4d2
          path: hl2sdk-l4d2

      - name: 7. Descargar SteamWorks SDK
        uses: actions/checkout@v4
        with:
          repository: rlabrecque/SteamworksSDK
          path: steamworks-sdk-temp

      - name: 8. Preparar Estructura Steam (Windows PowerShell)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "steamworks-sdk\public\steam"
          $headerFile = Get-ChildItem -Path "steamworks-sdk-temp" -Filter "steam_gameserver.h" -Recurse | Select-Object -First 1
          if ($headerFile) {
              $sourceDir = $headerFile.DirectoryName
              Copy-Item -Path "$sourceDir\*" -Destination "steamworks-sdk\public\steam\" -Recurse -Force
              Write-Host "Archivos copiados desde: $sourceDir"
          } else {
              Write-Error "No se encontró el SDK de Steamworks"
              exit 1
          }

      - name: 9. Parche Automático de configure.py (Evita error de Python)
        shell: powershell
        run: |
          $path = "sourcetvsupport/configure.py"
          if (Test-Path $path) {
            (Get-Content $path) -replace '%default', '%(default)s' | Set-Content $path
            Write-Host "Archivo configure.py parcheado automáticamente."
          }

      - name: 10. Compilar con MSVC
        shell: cmd
        working-directory: sourcetvsupport
        env:
          SOURCEMOD: ${{ github.workspace }}\sourcemod
          HL2SDKL4D2: ${{ github.workspace }}\hl2sdk-l4d2
          MMSOURCE112: ${{ github.workspace }}\mmsource
          SWSDK: ${{ github.workspace }}\steamworks-sdk
        run: |
          if not exist build mkdir build
          cd build
          python ..\configure.py --enable-optimize --sdks=l4d2 --targets=x86 --sm-path="..\..\sourcemod" --mms-path="..\..\mmsource" --hl2sdk-root="..\..\" --swsdk-path="..\..\steamworks-sdk"
          ambuild

      - name: 11. Subir archivo .DLL final
        uses: actions/upload-artifact@v4
        with:
          name: sourcetvsupport-l4d2-windows-fixed
          path: sourcetvsupport/build/package/**/*.dll
