name: Compilar L4D2 (SteamWorks Kyle Fix)

on: [push, workflow_dispatch]

jobs:
  build:
    name: Compilar Ubuntu 20.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: 1. Instalar dependencias
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 python3-pip build-essential gcc-multilib g++-multilib clang

      - name: 2. Instalar AMBuild
        run: |
          pip3 install wheel
          pip3 install git+https://github.com/alliedmodders/ambuild

      # --- DESCARGAS ---
      - name: 3. Descargar Tu Codigo (SourceTV Support)
        uses: actions/checkout@v4
        with:
          path: sourcetvsupport

      - name: 4. Descargar SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: master
          path: sourcemod
          submodules: true

      - name: 5. Descargar MetaMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource

      - name: 6. Descargar HL2SDK (L4D2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: l4d2
          path: hl2sdk-l4d2

      # USAMOS EL REPO QUE ENCONTRASTE (KyleSanderson)
      - name: 7. Descargar SteamWorks SDK (KyleSanderson)
        uses: actions/checkout@v4
        with:
          repository: KyleSanderson/SteamWorks
          ref: master
          path: steamworks-sdk

      # --- COMPILACIÓN ---
      - name: 8. Compilar
        working-directory: sourcetvsupport
        env:
          SOURCEMOD: ${{ github.workspace }}/sourcemod
          HL2SDKL4D2: ${{ github.workspace }}/hl2sdk-l4d2
          MMSOURCE112: ${{ github.workspace }}/mmsource
          SWSDK: ${{ github.workspace }}/steamworks-sdk
        run: |
          mkdir -p build
          cd build
          
          # Configuramos el build
          # Nota: Algunos scripts esperan que steamworks esté un nivel arriba
          python3 ../configure.py \
            --enable-optimize \
            --sdks=l4d2 \
            --targets=x86 \
            --sm-path="../../sourcemod" \
            --mms-path="../../mmsource" \
            --hl2sdk-root="../../" \
            --swsdk-path="../../steamworks-sdk"

          ambuild

      - name: 9. Subir archivo .SO
        uses: actions/upload-artifact@v4
        with:
          name: sourcetvsupport-l4d2-linux-fixed
          path: sourcetvsupport/build/package/**/*.so
