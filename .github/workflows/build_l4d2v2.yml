name: Compilar L4D2 (Bypass Git Errors)

on: [push, workflow_dispatch]

jobs:
  build:
    name: Compilar Ubuntu 20.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: 1. Instalar dependencias
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 python3-pip build-essential gcc-multilib g++-multilib clang wget unzip

      - name: 2. Instalar AMBuild
        run: |
          pip3 install wheel
          pip3 install git+https://github.com/alliedmodders/ambuild

      # --- DESCARGAS LIMPIAS ---
      - name: 3. Descargar Tu Codigo
        uses: actions/checkout@v4
        with:
          path: sourcetvsupport

      - name: 4. Descargar SourceMod (Rama Estable)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: master
          path: sourcemod
          submodules: true

      - name: 5. Descargar MetaMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource

      - name: 6. Descargar HL2SDK (L4D2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: l4d2
          path: hl2sdk-l4d2

      # DESCARGA MANUAL DEL STEAMWORKS SDK PARA EVITAR FALLOS DE GIT
      - name: 7. Descargar SteamWorks SDK (Manual)
        run: |
          mkdir -p steamworks-sdk
          cd steamworks-sdk
          wget https://github.com/alliedmodders/hl2sdk/archive/refs/heads/sdk-2013.zip -O sdk.zip
          unzip sdk.zip
          mv hl2sdk-sdk-2013/* .
          rm -rf hl2sdk-sdk-2013 sdk.zip

      # --- COMPILACIÓN ---
      - name: 8. Compilar
        working-directory: sourcetvsupport
        env:
          SOURCEMOD: ${{ github.workspace }}/sourcemod
          HL2SDKL4D2: ${{ github.workspace }}/hl2sdk-l4d2
          MMSOURCE112: ${{ github.workspace }}/mmsource
          SWSDK: ${{ github.workspace }}/steamworks-sdk
        run: |
          mkdir -p build
          cd build
          
          python3 ../configure.py \
            --enable-optimize \
            --sdks=l4d2 \
            --targets=x86 \
            --sm-path="../../sourcemod" \
            --mms-path="../../mmsource" \
            --hl2sdk-root="../../" \
            --swsdk-path="../../steamworks-sdk"

          ambuild

      - name: 9. Subir archivo .SO
        uses: actions/upload-artifact@v4
        with:
          name: sourcetvsupport-l4d2-linux-fixed
          path: sourcetvsupport/build/package/**/*.so
