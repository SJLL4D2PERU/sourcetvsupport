name: Compilar L4D2 Windows (API 16 - SM 1.12 - Steamworks Fix)

on: [push, workflow_dispatch]

jobs:
  build:
    name: Compilar Windows (API 16)
    runs-on: windows-latest

    steps:
      - name: 1. Configurar Entorno MSVC (Compilador C++ de Windows)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: 2. Instalar AMBuild
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          pip install git+https://github.com/alliedmodders/ambuild

      - name: 3. Descargar Tu Codigo
        uses: actions/checkout@v4
        with:
          path: sourcetvsupport

      - name: 4. Descargar SourceMod (Estable 1.12 / API 16)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: sourcemod
          submodules: true

      - name: 5. Descargar MetaMod (Estable 1.12)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          path: mmsource

      - name: 6. Descargar HL2SDK (L4D2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: l4d2
          path: hl2sdk-l4d2

      - name: 7. Descargar SteamWorks SDK (rlabrecque)
        uses: actions/checkout@v4
        with:
          repository: rlabrecque/SteamworksSDK
          path: steamworks-sdk-temp

      - name: 8. Localizar y Preparar Estructura Steam
        shell: bash
        run: |
          mkdir -p steamworks-sdk/public/steam
          
          # Buscamos el archivo steam_gameserver.h usando bash en Windows
          FOUND_FILE=$(find steamworks-sdk-temp -name "steam_gameserver.h" -print -quit)
          
          if [ -n "$FOUND_FILE" ]; then
            SOURCE_DIR=$(dirname "$FOUND_FILE")
            echo "--- Archivos encontrados en: $SOURCE_DIR ---"
            cp -r "$SOURCE_DIR"/* steamworks-sdk/public/steam/
            echo "Verificación: $(ls steamworks-sdk/public/steam/steam_gameserver.h)"
          else
            echo "ERROR: No se encontró el SDK de Steamworks en ninguna carpeta."
            exit 1
          fi

      - name: 9. Compilar
        working-directory: sourcetvsupport
        shell: bash
        env:
          SOURCEMOD: ${{ github.workspace }}/sourcemod
          HL2SDKL4D2: ${{ github.workspace }}/hl2sdk-l4d2
          MMSOURCE112: ${{ github.workspace }}/mmsource
          SWSDK: ${{ github.workspace }}/steamworks-sdk
        run: |
          mkdir -p build
          cd build
          
          python ../configure.py \
            --enable-optimize \
            --sdks=l4d2 \
            --targets=x86 \
            --sm-path="../../sourcemod" \
            --mms-path="../../mmsource" \
            --hl2sdk-root="../../" \
            --swsdk-path="../../steamworks-sdk"
            
          ambuild

      - name: 10. Subir archivo .DLL final
        uses: actions/upload-artifact@v4
        with:
          name: sourcetvsupport-API16-SM1.12-windows
          path: sourcetvsupport/build/package/**/*.dll
