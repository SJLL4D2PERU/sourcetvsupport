name: Compilar L4D2 (Fix SourceMod)

on: [push, workflow_dispatch]

jobs:
  build:
    name: Compilar Ubuntu 20.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: 1. Instalar dependencias
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 python3-pip build-essential gcc-multilib g++-multilib clang tree

      - name: 2. Instalar AMBuild
        run: |
          pip3 install wheel
          pip3 install git+https://github.com/alliedmodders/ambuild

      # --- DESCARGAS ---
      - name: 3. Descargar Tu Codigo
        uses: actions/checkout@v4
        with:
          path: src

      - name: 4. Descargar SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: sourcemod

      - name: 5. Descargar MetaMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          path: mmsource

      - name: 6. Descargar HL2SDK (L4D2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: l4d2
          path: hl2sdk-l4d2

      # --- COMPILACIÓN ---
      - name: 7. Compilar (Variables Totales)
        working-directory: src
        # AQUÍ ESTÁ EL FIX: Agregamos TODAS las variantes de nombres posibles para SourceMod
        env:
          # HL2SDK (Ya funcionó)
          HL2SDKL4D2: ${{ github.workspace }}/hl2sdk-l4d2
          HL2SDK_L4D2: ${{ github.workspace }}/hl2sdk-l4d2
          
          # MMSOURCE
          MMSOURCE112: ${{ github.workspace }}/mmsource
          MMSOURCE: ${{ github.workspace }}/mmsource
          
          # SOURCEMOD (El que fallaba)
          SOURCEMOD112: ${{ github.workspace }}/sourcemod
          SOURCEMOD: ${{ github.workspace }}/sourcemod
          SOURCEMOD_PATH: ${{ github.workspace }}/sourcemod
          SM_PATH: ${{ github.workspace }}/sourcemod
          
          CC: clang
          CXX: clang++
        run: |
          echo "=== VERIFICANDO RUTAS (DEBUG) ==="
          ls -ld $HL2SDKL4D2
          ls -ld $MMSOURCE
          ls -ld $SOURCEMOD
          echo "================================="
          
          mkdir -p build
          cd build
          
          # Ejecutamos configure.py
          python3 ../configure.py \
            --enable-optimize \
            --sdks=l4d2 \
            --targets=x86 \
            --sm-path="${{ github.workspace }}/sourcemod" \
            --mms-path="${{ github.workspace }}/mmsource"

          # Compilamos
          ambuild

      - name: 8. Subir archivo .SO
        uses: actions/upload-artifact@v4
        with:
          name: sourcetvsupport-l4d2-linux-fixed
          path: src/build/package/**/*.so
