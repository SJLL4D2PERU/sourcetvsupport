name: Compilar L4D2 Final (Env Vars)

on: [push, workflow_dispatch]

jobs:
  build:
    name: Compilar Ubuntu 20.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: 1. Instalar dependencias
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 python3-pip build-essential gcc-multilib g++-multilib clang

      - name: 2. Instalar AMBuild
        run: |
          pip3 install wheel
          pip3 install git+https://github.com/alliedmodders/ambuild

      - name: 3. Descargar Tu Codigo
        uses: actions/checkout@v4
        with:
          path: src

      - name: 4. Descargar SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: sourcemod

      - name: 5. Descargar MetaMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          path: mmsource

      - name: 6. Descargar HL2SDK (L4D2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: l4d2
          path: hl2sdk-l4d2

      - name: 7. Compilar (Con Variables de Entorno)
        working-directory: src
        run: |
          mkdir -p build
          cd build
          
          # === LA SOLUCIÓN ===
          # Definimos manualmente dónde está cada cosa usando variables de entorno.
          # Esto evita que AMBuild tenga que "adivinar" y fallar.
          export HL2SDKL4D2="${{ github.workspace }}/hl2sdk-l4d2"
          export MMSOURCE112="${{ github.workspace }}/mmsource"
          
          # Ejecutamos configure.py pasándole también las rutas por si acaso
          python3 ../configure.py \
            --enable-optimize \
            --sdks=l4d2 \
            --targets=x86 \
            --sm-path="${{ github.workspace }}/sourcemod" \
            --mms-path="${{ github.workspace }}/mmsource"

          # Compilamos
          ambuild

      - name: 8. Subir archivo .SO
        uses: actions/upload-artifact@v4
        with:
          name: sourcetvsupport-l4d2-linux-fixed
          path: src/build/package/**/*.so
