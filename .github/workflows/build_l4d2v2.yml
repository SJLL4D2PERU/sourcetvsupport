name: Compilar L4D2 Linux (Fix GLIBC)

on: [push, workflow_dispatch]

jobs:
  build:
    name: Compilar en Ubuntu 20.04 (Legacy)
    # Usamos la máquina rápida...
    runs-on: ubuntu-latest
    # ...pero la encerramos en una jaula de Linux Viejo (20.04)
    # Esto soluciona tu error: /lib/i386-linux-gnu/libc.so.6: version `GLIBC_2.38' not found
    container:
      image: ubuntu:20.04

    steps:
      - name: 1. Instalar dependencias básicas (Root)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 python3-pip build-essential gcc-multilib g++-multilib clang

      - name: 2. Instalar AMBuild
        run: |
          pip3 install wheel
          pip3 install git+https://github.com/alliedmodders/ambuild

      - name: 3. Descargar Tu Codigo (SourceTV Support)
        uses: actions/checkout@v4
        with:
          path: src

      - name: 4. Descargar SourceMod (1.12)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: sourcemod

      - name: 5. Descargar MetaMod (1.12)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          path: mmsource

      - name: 6. Descargar HL2SDK (L4D2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: l4d2
          path: hl2sdk-l4d2

      - name: 7. Compilar
        working-directory: src
        run: |
          mkdir -p build
          cd build
          # NOTA: He quitado --swsdk-path porque requiere contraseña privada.
          # Usualmente hl2sdk-l4d2 es suficiente.
          python3 ../configure.py \
            --enable-optimize \
            --sdks=l4d2 \
            --targets=x86 \
            --sm-path="${{ github.workspace }}/sourcemod" \
            --mms-path="${{ github.workspace }}/mmsource" \
            --hlsdk="${{ github.workspace }}/hl2sdk-l4d2"
          
          ambuild

      - name: 8. Subir el archivo .SO
        uses: actions/upload-artifact@v4
        with:
          name: sourcetvsupport-l4d2-linux-fixed
          path: src/build/package/**/*.so
