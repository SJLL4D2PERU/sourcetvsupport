name: Compilar L4D2 (Steamworks SDK Fix Final)

on: [push, workflow_dispatch]

jobs:
  build:
    name: Compilar Ubuntu 20.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: 1. Instalar dependencias
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 python3-pip build-essential gcc-multilib g++-multilib clang wget unzip

      - name: 2. Instalar AMBuild
        run: |
          pip3 install wheel
          pip3 install git+https://github.com/alliedmodders/ambuild

      - name: 3. Descargar Tu Codigo
        uses: actions/checkout@v4
        with:
          path: sourcetvsupport

      - name: 4. Descargar SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: master
          path: sourcemod
          submodules: true

      - name: 5. Descargar MetaMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource

      - name: 6. Descargar HL2SDK (L4D2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: l4d2
          path: hl2sdk-l4d2

      # PASO CLAVE: Descargar los headers reales de Steamworks
      - name: 7. Descargar Steamworks SDK Headers (Garantizado)
        run: |
          mkdir -p steamworks-sdk/public/steam
          cd steamworks-sdk/public/steam/
          # Descargamos los 4-5 archivos esenciales que pide el compilador
          BASE_URL="https://raw.githubusercontent.com/alliedmodders/hl2sdk/sdk-2013/public/steam"
          wget $BASE_URL/steam_api.h
          wget $BASE_URL/steam_gameserver.h
          wget $BASE_URL/isteamgameserver.h
          wget $BASE_URL/isteamgameserverstats.h
          wget $BASE_URL/steamclientpublic.h
          wget $BASE_URL/steamtypes.h
          wget $BASE_URL/isteamclient.h
          wget $BASE_URL/isteamnetworkingsockets.h || true
          echo "Archivos descargados en steamworks-sdk/public/steam:"
          ls -l

      - name: 8. Compilar
        working-directory: sourcetvsupport
        env:
          SOURCEMOD: ${{ github.workspace }}/sourcemod
          HL2SDKL4D2: ${{ github.workspace }}/hl2sdk-l4d2
          MMSOURCE112: ${{ github.workspace }}/mmsource
          SWSDK: ${{ github.workspace }}/steamworks-sdk
        run: |
          mkdir -p build
          cd build
          
          python3 ../configure.py \
            --enable-optimize \
            --sdks=l4d2 \
            --targets=x86 \
            --sm-path="../../sourcemod" \
            --mms-path="../../mmsource" \
            --hl2sdk-root="../../" \
            --swsdk-path="../../steamworks-sdk"
            
          ambuild

      - name: 9. Subir archivo .SO final
        uses: actions/upload-artifact@v4
        with:
          name: sourcetvsupport-l4d2-linux-fixed
          path: sourcetvsupport/build/package/**/*.so
